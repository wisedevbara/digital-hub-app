version: "3.9"

networks:
  digital-hub-net:
    external: false

services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - digital-hub-net
    env_file:
      - .env
    ports:
      - "9000:9000"

  postgres:
    image: postgres:16-alpine
    container_name: postgres_app
    restart: unless-stopped
    networks:
      - digital-hub-net
    env_file:
      - .env
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data

  redis:
    image: redis:8.2
    container_name: redis_app
    restart: unless-stopped
    networks:
      - digital-hub-net
    env_file:
      - .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_app_data:/data

  nginx:
    image: nginx:1.30.5
    container_name: nginx_app
    restart: unless-stopped
    depends_on:
      - laravel
    networks:
      - digital-hub-net
    env_file:
      - .env
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  php:
    image: php:8.3.35-alpine3.23
    container_name: php_app
    restart: unless-stopped
    networks:
      - digital-hub-net
    env_file:
      - .env
    command: ["php", "-S", "0.0.0.0:9000", "-t", "/var/www/html/public"]
    volumes:
      - ./laravel:/var/www/html

volumes:
  postgres_app_data:
  redis_app_data:
