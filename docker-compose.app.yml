version: "3.9"

networks:
  digital-hub-net:
    external: false

services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./laravel:/var/www/html 
    container_name: laravel_app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - digital-hub-net
    env_file:
      - .env
    ports:
      - "9000:9000"

  postgres:
    image: postgres:16-alpine
    container_name: postgres_app
    restart: unless-stopped
    networks:
      - digital-hub-net
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data

  redis:
    image: redis:8.2
    container_name: redis_app
    restart: unless-stopped
    networks:
      - digital-hub-net
    env_file:
      - .env
    ports:
      - "6380:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./redis_app_data:/data

  nginx:
    image: nginx:1.30.5
    container_name: nginx_app
    restart: unless-stopped
    depends_on:
      - laravel
    networks:
      - digital-hub-net
    env_file:
      - .env
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./laravel:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf   # ✅ BENAR

volumes:
  postgres_app_data:
  redis_app_data:
