networks:
  digital-hub-net:
    name: digital-hub-net
    external: true

services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./laravel:/var/www/html 
    container_name: laravel_app
    restart: unless-stopped
    depends_on:
      - postgres-app
      - redis-app
    networks:
      - digital-hub-net
    env_file:
      - .env
    ports:
      - "9000:9000"

  # Service name is deliberately unique across stacks. Both compose files share
  # the external network digital-hub-net, and Docker turns the service name into
  # a network alias automatically - two services both named "postgres" made
  # that name resolve round-robin to either stack.
  postgres-app:
    image: postgres:16-alpine
    container_name: postgres_app
    restart: unless-stopped
    networks:
      digital-hub-net:
        aliases:
          - postgres-app
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data

  redis-app:
    image: redis:8.2
    container_name: redis_app
    restart: unless-stopped
    networks:
      digital-hub-net:
        aliases:
          - redis-app
    env_file:
      - .env
    ports:
      - "6381:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./redis_app_data:/data

  nginx:
    image: nginx:1.30.5
    container_name: nginx_app
    restart: unless-stopped
    depends_on:
      - laravel
    networks:
      - digital-hub-net
    env_file:
      - .env
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./laravel:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf   # ✅ BENAR

volumes:
  postgres_app_data:
  redis_app_data:
